[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter-ai"
version = "1.0.0"
description = "Fully automated AI-powered job discovery and application platform controlled via Telegram"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Priyanshu Rai", email = "ppprai1712@gmail.com"},
]

dependencies = [
    # Telegram Bot
    "python-telegram-bot[ext]>=21.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    # Scheduler
    "APScheduler>=3.10.4",
    # Browser Automation
    "playwright>=1.44.0",
    # HTTP Client
    "httpx>=0.27.0",
    # HTML Parsing
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # NLP & Matching
    "spacy>=3.7.0",
    "scikit-learn>=1.5.0",
    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # Logging
    "structlog>=24.1.0",
    # Export
    "openpyxl>=3.1.0",
    "reportlab>=4.2.0",
    # Utilities
    "aiofiles>=24.1.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "factory-boy>=3.3.0",
    "aiosqlite>=0.20.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0",
    "types-beautifulsoup4>=4.12.0",
    "types-openpyxl>=3.1.0",
    "types-aiofiles>=24.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "telegram.*",
    "apscheduler.*",
    "playwright.*",
    "bs4.*",
    "spacy.*",
    "sklearn.*",
    "reportlab.*",
    "openpyxl.*",
    "aiofiles.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
